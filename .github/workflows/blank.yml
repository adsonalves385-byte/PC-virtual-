(() => {
  const boxes = [...document.querySelectorAll("[data-check]")];
  const progress = document.getElementById("progress");
  const update = () => {
    const done = boxes.filter(box => box.checked).length;
    progress.textContent = `${done}/${boxes.length} concluídos`;
    boxes.forEach(box => {
      const label = box.closest("label");
      label.style.opacity = box.checked ? ".72" : "1";
      label.style.textDecoration = box.checked ? "line-through" : "none";
    });
  };
  boxes.forEach(box => box.addEventListener("change", update));
  document.getElementById("reset").addEventListener("click", () => {
    boxes.forEach(box => { box.checked = false; });
    update();
  });
  update();
})();<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>CloudPC — Seu PC na nuvem</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">▰</span> CloudPC <span class="tag">STARTER</span></div>
    <span class="status"><i></i> Painel local</span>
  </header>
  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">SEU ESPAÇO DE JOGOS E TRABALHO</p>
      <h1>Seu PC.<br><span>Em qualquer lugar.</span></h1>
      <p class="intro">Um painel inicial para acessar seu computador Windows remoto pelo Android. O servidor Windows com GPU e o streaming precisam ser configurados separadamente.</p>
      <a class="button primary" href="#setup">Configurar meu PC <span>↗</span></a>
    </section>
    <section class="stats">
      <article><span class="stat-icon">▣</span><div><small>Plataforma</small><strong>Windows 10/11</strong></div></article>
      <article><span class="stat-icon">◉</span><div><small>Cliente</small><strong>Android</strong></div></article>
      <article><span class="stat-icon">⌁</span><div><small>Streaming</small><strong>Moonlight + Sunshine</strong></div></article>
    </section>
    <section class="section" id="setup">
      <div class="section-heading"><div><p class="eyebrow">COMECE AQUI</p><h2>Preparar o computador remoto</h2></div><span class="step-count">3 etapas</span></div>
      <div class="steps">
        <article class="step"><span class="number">01</span><div><h3>Crie uma VM Windows com GPU</h3><p>Escolha um provedor que ofereça Windows 10/11 (ou uma imagem compatível/licenciada), GPU, acesso administrativo e tráfego suficiente. Confira o preço por hora e desligue a VM quando terminar.</p><a href="https://learn.microsoft.com/azure/virtual-machines/" target="_blank" rel="noreferrer">Documentação de máquinas virtuais ↗</a></div></article>
        <article class="step"><span class="number">02</span><div><h3>Instale o Sunshine no Windows</h3><p>Sunshine transmite jogos e a área de trabalho. Instale-o no computador remoto e abra a interface de configuração local seguindo a documentação oficial.</p><a href="https://docs.lizardbyte.dev/projects/sunshine/latest/" target="_blank" rel="noreferrer">Guia oficial do Sunshine ↗</a></div></article>
        <article class="step"><span class="number">03</span><div><h3>Conecte o Android com Moonlight</h3><p>Instale Moonlight no celular e faça o pareamento com o host seguindo o guia. Para conexões pela internet, use uma VPN privada ou o método seguro recomendado pelo provedor; não exponha a interface administrativa diretamente à internet.</p><a href="https://github.com/moonlight-stream/moonlight-android" target="_blank" rel="noreferrer">Moonlight para Android ↗</a></div></article>
      </div>
    </section>
    <section class="notice">
      <span class="notice-icon">!</span>
      <div><strong>Este painel não cria a máquina virtual sozinho.</strong><p>Ele é um frontend inicial e uma lista de configuração. Para jogar, você ainda precisa contratar/configurar a VM com GPU, instalar o Windows de forma licenciada e configurar o streaming. Não coloque senhas, chaves de API ou dados de pagamento neste site.</p></div>
    </section>
    <section class="section checklist-section">
      <div class="section-heading"><div><p class="eyebrow">ACOMPANHAMENTO</p><h2>Checklist de instalação</h2></div><span class="progress" id="progress">0/4 concluídos</span></div>
      <div class="checklist">
        <label><input type="checkbox" data-check="vm"> VM Windows com GPU criada</label>
        <label><input type="checkbox" data-check="driver"> Driver gráfico instalado e testado</label>
        <label><input type="checkbox" data-check="sunshine"> Sunshine instalado e pareado</label>
        <label><input type="checkbox" data-check="moonlight"> Moonlight conectado pelo Android</label>
      </div>
      <button class="button secondary" id="reset">Limpar checklist</button>
    </section>
    <footer><span>CloudPC Starter</span><span>Projeto demonstrativo · Sem backend</span></footer>
  </main>
  <script src="./app.js"></script>
</body>
